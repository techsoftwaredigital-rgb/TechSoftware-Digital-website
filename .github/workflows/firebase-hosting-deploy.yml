name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -d "dist" ] || [ ! -f "dist/index.html" ]; then
            echo "::error::Production build directory 'dist' or 'dist/index.html' not found."
            exit 1
          fi
          echo "Build output verified: dist/ directory contains index.html and assets."

      - name: Verify Google Search Console verification file
        run: |
          test -f dist/googlef8752ce3b062c179.html
          grep -Fx "google-site-verification: googlef8752ce3b062c179.html" dist/googlef8752ce3b062c179.html
          echo "Verified dist/googlef8752ce3b062c179.html exists with exact verification token."

      - name: Verify SEO sitemap.xml and robots.txt
        run: |
          test -f dist/sitemap.xml
          grep -F "https://techsoftwaredigital.in/" dist/sitemap.xml
          test -f dist/robots.txt
          grep -F "Sitemap: https://techsoftwaredigital.in/sitemap.xml" dist/robots.txt
          echo "Verified dist/sitemap.xml and dist/robots.txt exist and contain canonical directives."

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_TECHSOFTWARE_DIGITAL_WEBSITES }}
          channelId: live
          projectId: techsoftware-digital-websites
