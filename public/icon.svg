<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="tsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.3" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#06b6d4" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Deep dark base background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle circuit borders -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#1e293b" stroke-width="4" stroke-dasharray="16 8" />

  <!-- Center Gradient Emblem -->
  <g filter="url(#shadow)">
    <rect x="96" y="96" width="320" height="320" rx="72" fill="url(#tsGrad)" />
  </g>

  <!-- High-contrast TS Typography -->
  <text x="256" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', sans-serif" font-size="160" font-weight="900" fill="#030712" text-anchor="middle" letter-spacing="-6">TS</text>

  <!-- Futuristic Corner Highlights -->
  <circle cx="128" cy="128" r="8" fill="#a5f3fc" />
  <circle cx="384" cy="384" r="8" fill="#c7d2fe" />
  <path d="M 220 380 L 292 380" stroke="#030712" stroke-width="8" stroke-linecap="round" />
</svg>
